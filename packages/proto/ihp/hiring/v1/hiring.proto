syntax = "proto3";

package ihp.hiring.v1;

import "ihp/requests/v1/requests.proto";

// draft is invisible to the public, open takes applications, closed stops them while the
// pipeline carries on, archived hides the posting from the staff list too.
enum PostingStatus {
  POSTING_STATUS_UNSPECIFIED = 0;
  POSTING_STATUS_DRAFT = 1;
  POSTING_STATUS_OPEN = 2;
  POSTING_STATUS_CLOSED = 3;
  POSTING_STATUS_ARCHIVED = 4;
}

// Filter value: CURRENT is every posting not archived, and the list's default.
enum PostingStatusFilter {
  POSTING_STATUS_FILTER_UNSPECIFIED = 0;
  POSTING_STATUS_FILTER_CURRENT = 1;
  POSTING_STATUS_FILTER_DRAFT = 2;
  POSTING_STATUS_FILTER_OPEN = 3;
  POSTING_STATUS_FILTER_CLOSED = 4;
  POSTING_STATUS_FILTER_ARCHIVED = 5;
}

enum Workplace {
  WORKPLACE_UNSPECIFIED = 0;
  WORKPLACE_ONSITE = 1;
  WORKPLACE_HYBRID = 2;
  WORKPLACE_REMOTE = 3;
}

// What a posting's pay range is paid per.
enum SalaryPeriod {
  SALARY_PERIOD_UNSPECIFIED = 0;
  SALARY_PERIOD_YEAR = 1;
  SALARY_PERIOD_MONTH = 2;
  SALARY_PERIOD_HOUR = 3;
}

enum EmploymentType {
  EMPLOYMENT_TYPE_UNSPECIFIED = 0;
  EMPLOYMENT_TYPE_FULL_TIME = 1;
  EMPLOYMENT_TYPE_PART_TIME = 2;
  EMPLOYMENT_TYPE_CONTRACT = 3;
  EMPLOYMENT_TYPE_INTERNSHIP = 4;
  EMPLOYMENT_TYPE_TEMPORARY = 5;
}

// active moves through a posting's stages; hired, rejected and withdrawn end it.
enum ApplicationStatus {
  APPLICATION_STATUS_UNSPECIFIED = 0;
  APPLICATION_STATUS_ACTIVE = 1;
  APPLICATION_STATUS_HIRED = 2;
  APPLICATION_STATUS_REJECTED = 3;
  APPLICATION_STATUS_WITHDRAWN = 4;
}

// Filter value: ACTIVE is a list's default, and ALL has no stored counterpart.
enum ApplicationStatusFilter {
  APPLICATION_STATUS_FILTER_UNSPECIFIED = 0;
  APPLICATION_STATUS_FILTER_ACTIVE = 1;
  APPLICATION_STATUS_FILTER_HIRED = 2;
  APPLICATION_STATUS_FILTER_REJECTED = 3;
  APPLICATION_STATUS_FILTER_WITHDRAWN = 4;
  APPLICATION_STATUS_FILTER_ALL = 5;
}

// One step of a posting's pipeline. A non-empty message is emailed to the applicant when they
// are moved into the stage.
message Stage {
  string id = 1;
  string name = 2;
  string message = 3;
}

message HiringSettings {
  optional string hr_team_id = 1;
  optional string hr_team_name = 2;
  repeated Stage default_stages = 3;
  string rejection_message = 4;
  // Only an admin decides which department runs hiring; HR edits the rest.
  bool can_edit_hr_team = 5;
}

message Posting {
  string id = 1;
  string slug = 2;
  string title = 3;
  string summary = 4;
  string description = 5;
  string location = 6;
  Workplace workplace = 7;
  EmploymentType employment_type = 8;
  optional int32 salary_min = 9;
  optional int32 salary_max = 10;
  string salary_currency = 11;
  PostingStatus status = 12;
  bool resume_required = 13;
  repeated Stage stages = 14;
  optional string application_form_id = 15;
  optional string application_form_name = 16;
  // The form's questions, so the preview and the public page render without a second call.
  repeated ihp.requests.v1.FormField application_fields = 17;
  optional string team_id = 18;
  optional string team_name = 19;
  optional string opened_at = 20;
  optional string closes_at = 21;
  string created_at = 22;
  string updated_at = 23;
  int32 applicant_count = 24;
  // Applicants still moving through the pipeline, and how many sit in each stage.
  int32 active_count = 25;
  map<string, int32> stage_counts = 26;
  SalaryPeriod salary_period = 27;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  HiringSettings settings = 1;
}

message SaveSettingsRequest {
  optional string hr_team_id = 1;
  repeated Stage default_stages = 2;
  string rejection_message = 3;
}

message SaveSettingsResponse {
  HiringSettings settings = 1;
}

message ListPostingsRequest {
  PostingStatusFilter status = 1;
  string search = 2;
  repeated string team_ids = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListPostingsResponse {
  repeated Posting rows = 1;
  ihp.requests.v1.PageInfo page_info = 2;
}

message GetPostingRequest {
  string posting_id = 1;
}

message GetPostingResponse {
  Posting posting = 1;
}

// Creates when posting_id is absent. Status is not part of a save: publishing is its own call.
message SavePostingRequest {
  optional string posting_id = 1;
  string title = 2;
  string summary = 3;
  string description = 4;
  string location = 5;
  Workplace workplace = 6;
  EmploymentType employment_type = 7;
  optional int32 salary_min = 8;
  optional int32 salary_max = 9;
  string salary_currency = 10;
  bool resume_required = 11;
  repeated Stage stages = 12;
  optional string application_form_id = 13;
  optional string team_id = 14;
  // An ISO date; absent means the posting stays open until someone closes it.
  optional string closes_at = 15;
  SalaryPeriod salary_period = 16;
}

message SavePostingResponse {
  Posting posting = 1;
}

message SetPostingStatusRequest {
  string posting_id = 1;
  PostingStatus status = 2;
}

message SetPostingStatusResponse {
  Posting posting = 1;
}

message DeletePostingRequest {
  string posting_id = 1;
}

message DeletePostingResponse {}

// One applicant as a list row or a board card.
message ApplicationSummary {
  string id = 1;
  string posting_id = 2;
  string posting_title = 3;
  string full_name = 4;
  string email = 5;
  string phone = 6;
  ApplicationStatus status = 7;
  string stage_id = 8;
  // Resolved against the posting's current stages; a renamed stage shows its new name.
  string stage_name = 9;
  string stage_changed_at = 10;
  string created_at = 11;
  string updated_at = 12;
  bool has_resume = 13;
}

message ApplicationFile {
  string id = 1;
  // "resume", or the id of a file question on the application form.
  string field_id = 2;
  string file_name = 3;
  string content_type = 4;
  int32 file_size = 5;
}

message ApplicationNote {
  string id = 1;
  string author_id = 2;
  string author_name = 3;
  string body = 4;
  string created_at = 5;
  // The caller wrote it, so they may delete it.
  bool is_mine = 6;
}

message ApplicationEvent {
  string id = 1;
  // A sentence written on the server, e.g. "Moved to Interview".
  string label = 2;
  optional string actor_name = 3;
  optional string detail = 4;
  string created_at = 5;
}

message Application {
  ApplicationSummary summary = 1;
  // Snapshots taken when they applied: the posting's form may have moved on since.
  repeated ihp.requests.v1.FormField fields = 2;
  repeated ihp.requests.v1.FieldValue values = 3;
  repeated ApplicationFile files = 4;
  repeated ApplicationNote notes = 5;
  repeated ApplicationEvent events = 6;
  // The posting's stages now, which is what a move picks from.
  repeated Stage stages = 7;
  optional string rejection_reason = 8;
  string posting_slug = 9;
}

message ListApplicationsRequest {
  optional string posting_id = 1;
  ApplicationStatusFilter status = 2;
  optional string stage_id = 3;
  string search = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListApplicationsResponse {
  repeated ApplicationSummary rows = 1;
  ihp.requests.v1.PageInfo page_info = 2;
}

// Every applicant still in progress on one posting, for its board.
message ListPipelineRequest {
  string posting_id = 1;
}

message ListPipelineResponse {
  repeated ApplicationSummary rows = 1;
}

message GetApplicationRequest {
  string application_id = 1;
}

message GetApplicationResponse {
  Application application = 1;
}

message MoveApplicationRequest {
  string application_id = 1;
  string stage_id = 2;
  // Sends the stage's message, or the text below when HR rewrote it for this person.
  bool send_email = 3;
  optional string message = 4;
}

message MoveApplicationResponse {
  ApplicationSummary application = 1;
}

message RejectApplicationRequest {
  string application_id = 1;
  // For HR's eyes only; the applicant only ever sees the email message.
  string reason = 2;
  bool send_email = 3;
  string message = 4;
}

message RejectApplicationResponse {
  ApplicationSummary application = 1;
}

// Takes a rejection back, returning the applicant to the stage they were in.
message ReopenApplicationRequest {
  string application_id = 1;
}

message ReopenApplicationResponse {
  ApplicationSummary application = 1;
}

message AddNoteRequest {
  string application_id = 1;
  string body = 2;
}

message AddNoteResponse {
  ApplicationNote note = 1;
}

message DeleteNoteRequest {
  string note_id = 1;
}

message DeleteNoteResponse {}

service HiringService {
  // Which department runs hiring, and the defaults a new posting starts from.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc SaveSettings(SaveSettingsRequest) returns (SaveSettingsResponse);

  rpc ListPostings(ListPostingsRequest) returns (ListPostingsResponse);
  rpc GetPosting(GetPostingRequest) returns (GetPostingResponse);
  rpc SavePosting(SavePostingRequest) returns (SavePostingResponse);
  rpc SetPostingStatus(SetPostingStatusRequest) returns (SetPostingStatusResponse);
  // Only a draft nobody has applied to; anything else is archived instead.
  rpc DeletePosting(DeletePostingRequest) returns (DeletePostingResponse);

  // The pipeline: who applied, where each person stands, and moving them along.
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  rpc ListPipeline(ListPipelineRequest) returns (ListPipelineResponse);
  rpc GetApplication(GetApplicationRequest) returns (GetApplicationResponse);
  rpc MoveApplication(MoveApplicationRequest) returns (MoveApplicationResponse);
  rpc RejectApplication(RejectApplicationRequest) returns (RejectApplicationResponse);
  rpc ReopenApplication(ReopenApplicationRequest) returns (ReopenApplicationResponse);
  rpc AddNote(AddNoteRequest) returns (AddNoteResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);
}
