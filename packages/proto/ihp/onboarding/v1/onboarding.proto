syntax = "proto3";

package ihp.onboarding.v1;

// A department the person can join; these are the organization's teams.
message Department {
  string team_id = 1;
  string name = 2;
}

// Dates are ISO YYYY-MM-DD strings rather than Timestamps: they are whole calendar
// days off a date input, and a Timestamp would invent a time zone for them.
message Profile {
  string first_name = 1;
  string middle_initial = 2;
  string last_name = 3;
  string preferred_name = 4;
  string phone = 5;
  string date_of_birth = 6;
  string job_title = 7;
  string team_id = 8;
  string employment_type = 9;
  string start_date = 10;
  string photo_key = 11;
}

message GetOnboardingStateRequest {}

message GetOnboardingStateResponse {
  Profile profile = 1;
  repeated Department departments = 2;
  string email = 3;
  // Presigned and short lived, so it is fetched per render rather than stored.
  optional string photo_url = 4;
}

message CompleteOnboardingRequest {
  Profile profile = 1;
  bool confirmed = 2;
}

message CompleteOnboardingResponse {
  // Issued once and never reissued, so a second call returns the existing one.
  string ihp_id = 1;
}

message UploadPhotoRequest {
  bytes photo = 1;
  // Only ever used for the object key's extension; the type is sniffed from the bytes.
  string filename = 2;
  // Deleted after a successful upload, and only inside the caller's own prefix.
  string previous_key = 3;
}

message UploadPhotoResponse {
  string photo_key = 1;
  string photo_url = 2;
}

service OnboardingService {
  rpc GetOnboardingState(GetOnboardingStateRequest) returns (GetOnboardingStateResponse);
  rpc CompleteOnboarding(CompleteOnboardingRequest) returns (CompleteOnboardingResponse);
  rpc UploadPhoto(UploadPhotoRequest) returns (UploadPhotoResponse);
}
