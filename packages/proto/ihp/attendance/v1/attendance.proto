syntax = "proto3";

package ihp.attendance.v1;

// A break inside a day; one with no ended_at is the break being taken right now.
message AttendanceBreak {
  string id = 1;
  string started_at = 2;
  optional string ended_at = 3;
  int32 seconds = 4;
  bool is_running = 5;
}

// One person's working day: when they clocked in, the breaks they took, when they left.
message AttendanceDay {
  // 20 was approved_by_name, removed with the per-day sign-off.
  reserved 20;

  string id = 1;
  string user_id = 2;
  string user_name = 3;
  // The day the shift belongs to, as YYYY-MM-DD in the organization's zone.
  string work_date = 4;
  string clock_in_at = 5;
  optional string clock_out_at = 6;
  int32 worked_seconds = 7;
  int32 break_seconds = 8;
  int32 late_seconds = 9;
  // open while the clock runs, recorded once it stops.
  string status = 10;
  // clock when the buttons produced it, manual when somebody wrote it up.
  string source = 11;
  optional string note = 12;
  // Signed links, empty unless the caller may see the photo.
  optional string clock_in_selfie_url = 13;
  optional string clock_out_selfie_url = 14;
  optional string clock_in_location = 15;
  optional string clock_out_location = 16;
  bool is_open = 17;
  bool on_break = 18;
  repeated AttendanceBreak breaks = 19;
  // Nobody clocked out, so the shift's limit closed the day; cleared once an admin corrects it.
  bool auto_closed = 21;
}

// A scheduled day with no clock-in: excused by approved leave, or missed.
message AttendanceAbsence {
  string user_id = 1;
  string user_name = 2;
  string work_date = 3;
  // absent or leave.
  string kind = 4;
  optional string leave_name = 5;
}

// How the organization runs its clock. Every member reads it; only an admin writes it.
// What is true of the whole company: the zone its day is counted in, and the shift anybody
// without one of their own works.
message AttendanceSettings {
  // 1, 3, 4, 5, 6, 7, 8 and 9 were the clock's rules and the company hours; they belong to a
  // shift now. 2 was allow_manual_entry, removed when writing a day became admin-only.
  reserved 1, 2, 3, 4, 5, 6, 7, 8, 9;

  string time_zone = 10;
  optional string default_shift_id = 11;
}

// A named set of hours and the rules that go with them, written once and given to as many people
// as work them.
message AttendanceShift {
  string id = 1;
  string name = 2;
  int32 shift_start_minutes = 3;
  int32 shift_end_minutes = 4;
  int32 grace_minutes = 5;
  string workdays = 6;
  // How many people work it, so a shift is never deleted blind.
  int32 assigned_count = 7;
  bool require_selfie = 8;
  bool require_note = 9;
  bool capture_location = 10;
  // Hours after which a day nobody clocked out of is closed at that length; 0 never closes one.
  int32 auto_clock_out_hours = 11;
  // True of the shift the company falls back to.
  bool is_default = 12;
  // Emails people on it who have not clocked in, or are still clocked in, well past the hour.
  bool send_reminders = 13;
}

// The shift one person works; absent means they work the company hours in the settings.
message AttendanceSchedule {
  string user_id = 1;
  string user_name = 2;
  int32 shift_start_minutes = 3;
  int32 shift_end_minutes = 4;
  int32 grace_minutes = 5;
  string workdays = 6;
  // True when nobody has assigned this person a shift.
  bool is_default = 7;
  optional string shift_id = 8;
  optional string shift_name = 9;
  optional string job_title = 10;
}

message GetAttendanceSettingsRequest {}

message GetAttendanceSettingsResponse {
  AttendanceSettings settings = 1;
  // Whether this caller may change them, so the screen need not ask twice.
  bool can_manage = 2;
}

message UpdateAttendanceSettingsRequest {
  AttendanceSettings settings = 1;
}


message UpdateAttendanceSettingsResponse {
  AttendanceSettings settings = 1;
}

// Everything the clock screen needs in one call: today's row, the rules, and this person's shift.
message GetTimeClockRequest {}

message GetTimeClockResponse {
  optional AttendanceDay today = 1;
  AttendanceSettings settings = 2;
  AttendanceSchedule schedule = 3;
  bool can_manage = 4;
  // The shift this person works, and the rules their clock runs under.
  AttendanceShift shift = 5;
  // Set when today is a company holiday, so the screen can say so before anyone clocks in.
  optional string holiday_name = 6;
  // Set when today is approved leave, named after the form it came through.
  optional string leave_name = 7;
}

message ClockInRequest {
  optional string selfie_key = 1;
  optional string location = 2;
  optional string note = 3;
}

message ClockInResponse {
  AttendanceDay day = 1;
}

message ClockOutRequest {
  optional string selfie_key = 1;
  optional string location = 2;
  optional string note = 3;
}

message ClockOutResponse {
  AttendanceDay day = 1;
}

message StartBreakRequest {}

message StartBreakResponse {
  AttendanceDay day = 1;
}

message EndBreakRequest {}

message EndBreakResponse {
  AttendanceDay day = 1;
}

// Both halves of the log: a member reads their own, an admin reads anyone's.
message ListAttendanceRequest {
  string from = 1;
  string to = 2;
  // Empty means the caller themselves; any other value needs admin.
  optional string user_id = 3;
  // Admin only: everyone in the organization for the range.
  bool everyone = 4;
}

message ListAttendanceResponse {
  repeated AttendanceDay days = 1;
  int32 total_worked_seconds = 2;
  int32 total_break_seconds = 3;
  int32 total_late_seconds = 4;
  // Settled days only: today is still running, so it is never counted.
  repeated AttendanceAbsence absences = 5;
}

// Who is in, who is late, who is still on the clock.
message GetAttendanceBoardRequest {
  // YYYY-MM-DD; empty means today in the organization's zone.
  optional string date = 1;
}

message AttendanceBoardRow {
  string user_id = 1;
  string user_name = 2;
  optional string job_title = 3;
  optional AttendanceDay day = 4;
  // in, break or out with a clock-in; otherwise absent, leave, holiday, off or expected.
  string state = 5;
  // The leave or holiday behind a leave or holiday state.
  optional string off_reason = 6;
}

message GetAttendanceBoardResponse {
  repeated AttendanceBoardRow rows = 1;
  string date = 2;
  int32 present_count = 3;
  int32 late_count = 4;
  int32 absent_count = 5;
  int32 leave_count = 6;
}

// An admin correcting a day, or a member writing one up where the rules allow it. The times are
// wall clock ("09:00"), which the service pins to the work date in the organization's zone.
message SaveAttendanceDayRequest {
  // Empty creates the day.
  optional string day_id = 1;
  string user_id = 2;
  string work_date = 3;
  string clock_in_time = 4;
  optional string clock_out_time = 5;
  int32 break_minutes = 6;
  optional string note = 7;
}

message SaveAttendanceDayResponse {
  AttendanceDay day = 1;
}

message DeleteAttendanceDayRequest {
  string day_id = 1;
}

message DeleteAttendanceDayResponse {}

message ListSchedulesRequest {}

message ListSchedulesResponse {
  repeated AttendanceSchedule schedules = 1;
  AttendanceSettings settings = 2;
  repeated AttendanceShift shifts = 3;
}

message ListShiftsRequest {}

message ListShiftsResponse {
  repeated AttendanceShift shifts = 1;
  AttendanceSettings settings = 2;
}

message SaveShiftRequest {
  // Empty creates the shift.
  optional string shift_id = 1;
  string name = 2;
  int32 shift_start_minutes = 3;
  int32 shift_end_minutes = 4;
  int32 grace_minutes = 5;
  string workdays = 6;
  bool require_selfie = 7;
  bool require_note = 8;
  bool capture_location = 9;
  int32 auto_clock_out_hours = 10;
  bool send_reminders = 11;
}

message SaveShiftResponse {
  AttendanceShift shift = 1;
}

message DeleteShiftRequest {
  string shift_id = 1;
}

message DeleteShiftResponse {}

// Assigning is done where people are managed; an empty shift_id puts them back on the default.
message AssignShiftRequest {
  string user_id = 1;
  optional string shift_id = 2;
}

message AssignShiftResponse {
  AttendanceSchedule schedule = 1;
}

// A day the whole company is off.
message AttendanceHoliday {
  string id = 1;
  // YYYY-MM-DD.
  string date = 2;
  string name = 3;
}

message ListHolidaysRequest {
  int32 year = 1;
}

message ListHolidaysResponse {
  repeated AttendanceHoliday holidays = 1;
  bool can_manage = 2;
}

message SaveHolidayRequest {
  // Empty creates the holiday.
  optional string holiday_id = 1;
  string date = 2;
  string name = 3;
}

message SaveHolidayResponse {
  AttendanceHoliday holiday = 1;
}

message DeleteHolidayRequest {
  string holiday_id = 1;
}

message DeleteHolidayResponse {}

service AttendanceService {
  rpc GetAttendanceSettings(GetAttendanceSettingsRequest) returns (GetAttendanceSettingsResponse);
  rpc UpdateAttendanceSettings(UpdateAttendanceSettingsRequest) returns (UpdateAttendanceSettingsResponse);
  rpc GetTimeClock(GetTimeClockRequest) returns (GetTimeClockResponse);
  rpc ClockIn(ClockInRequest) returns (ClockInResponse);
  rpc ClockOut(ClockOutRequest) returns (ClockOutResponse);
  rpc StartBreak(StartBreakRequest) returns (StartBreakResponse);
  rpc EndBreak(EndBreakRequest) returns (EndBreakResponse);
  rpc ListAttendance(ListAttendanceRequest) returns (ListAttendanceResponse);
  rpc GetAttendanceBoard(GetAttendanceBoardRequest) returns (GetAttendanceBoardResponse);
  rpc SaveAttendanceDay(SaveAttendanceDayRequest) returns (SaveAttendanceDayResponse);
  rpc DeleteAttendanceDay(DeleteAttendanceDayRequest) returns (DeleteAttendanceDayResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc ListShifts(ListShiftsRequest) returns (ListShiftsResponse);
  rpc SaveShift(SaveShiftRequest) returns (SaveShiftResponse);
  rpc DeleteShift(DeleteShiftRequest) returns (DeleteShiftResponse);
  rpc AssignShift(AssignShiftRequest) returns (AssignShiftResponse);
  rpc ListHolidays(ListHolidaysRequest) returns (ListHolidaysResponse);
  rpc SaveHoliday(SaveHolidayRequest) returns (SaveHolidayResponse);
  rpc DeleteHoliday(DeleteHolidayRequest) returns (DeleteHolidayResponse);
}
