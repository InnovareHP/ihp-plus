syntax = "proto3";

package ihp.bulletin.v1;

// One emoji on one post, already counted: the feed never ships who reacted, only how many.
message ReactionSummary {
  string emoji = 1;
  int32 count = 2;
  bool reacted_by_me = 3;
}

// A photo on a post; the url is our own route, so it never expires the way a signed link does.
message BulletinImage {
  string id = 1;
  string url = 2;
}

message BulletinPost {
  string id = 1;
  string author_id = 2;
  string author_name = 3;
  string body = 4;
  optional string pinned_at = 5;
  optional string edited_at = 6;
  string created_at = 7;
  int32 comment_count = 8;
  repeated ReactionSummary reactions = 9;
  repeated BulletinImage images = 10;
  // post | birthday | anniversary | welcome — an open string, so a new occasion is not a contract change.
  string kind = 11;
}

message BulletinComment {
  string id = 1;
  string post_id = 2;
  string author_id = 3;
  string author_name = 4;
  string body = 5;
  optional string edited_at = 6;
  string created_at = 7;
}

message ListPostsRequest {
  // Pinned posts count toward the limit; they always sort first.
  int32 limit = 1;
}

message ListPostsResponse {
  repeated BulletinPost posts = 1;
  bool has_more = 2;
  // Who is reading, so the client decides what to offer without a second session call.
  string viewer_id = 3;
  bool can_moderate = 4;
}

message CreatePostRequest {
  string body = 1;
  // Photos uploaded beforehand by the same person, in the order the grid shows them.
  repeated string image_ids = 2;
  // Ids the composer resolved from the @names it offered; the server checks each is a colleague.
  repeated string mention_user_ids = 3;
}

message CreatePostResponse {
  BulletinPost post = 1;
}

message UpdatePostRequest {
  string post_id = 1;
  string body = 2;
}

message UpdatePostResponse {
  BulletinPost post = 1;
}

message DeletePostRequest {
  string post_id = 1;
}

message DeletePostResponse {}

message SetPostPinnedRequest {
  string post_id = 1;
  bool pinned = 2;
}

message SetPostPinnedResponse {
  BulletinPost post = 1;
}

message ToggleReactionRequest {
  string post_id = 1;
  string emoji = 2;
}

message ToggleReactionResponse {
  BulletinPost post = 1;
}

message ListCommentsRequest {
  string post_id = 1;
}

message ListCommentsResponse {
  repeated BulletinComment comments = 1;
}

message CreateCommentRequest {
  string post_id = 1;
  string body = 2;
  repeated string mention_user_ids = 3;
}

message CreateCommentResponse {
  BulletinComment comment = 1;
}

message DeleteCommentRequest {
  string comment_id = 1;
}

message DeleteCommentResponse {}

// Which automatic posts the organization wants.
message BulletinSettings {
  bool celebrate_birthdays = 1;
  bool celebrate_anniversaries = 2;
  bool welcome_new_hires = 3;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  BulletinSettings settings = 1;
}

message UpdateSettingsRequest {
  BulletinSettings settings = 1;
}

message UpdateSettingsResponse {
  BulletinSettings settings = 1;
}

// Someone who can be @mentioned: a name and nothing more, since every member sees this list.
message MentionablePerson {
  string user_id = 1;
  string name = 2;
}

message ListPeopleRequest {}

message ListPeopleResponse {
  repeated MentionablePerson people = 1;
}

service BulletinService {
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc SetPostPinned(SetPostPinnedRequest) returns (SetPostPinnedResponse);
  rpc ToggleReaction(ToggleReactionRequest) returns (ToggleReactionResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ListPeople(ListPeopleRequest) returns (ListPeopleResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}
