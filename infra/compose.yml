# Full stack, containerized. Mirrors production shape.
#   pnpm stack:up      (docker compose --env-file .env -f infra/compose.yml up --build)
# Entry point: http://localhost  ->  /  = Astro landing, /app = Next.js

name: ihp-plus

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ihp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-ihp_plus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ihp} -d ${POSTGRES_DB:-ihp_plus}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ihp}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-ihp_plus}
      REDIS_URL: redis://redis:6379
      # Behind the proxy the browser-visible origin is the proxy, not the container port.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'

  landing:
    build:
      context: ..
      dockerfile: infra/docker/landing.Dockerfile
    restart: unless-stopped
    expose:
      - '80'

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '${PROXY_PORT:-80}:80'
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - landing

volumes:
  postgres-data:
  redis-data:
