# Dev infra only — Postgres + Redis in Docker, apps run on the host via `pnpm dev`.
#
# pnpm infra:up
# pnpm dev
#
# web     -> http://localhost:3000/app
# landing -> http://localhost:4321

name: ihp-plus-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ihp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ihp_plus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ihp} -d ${POSTGRES_DB:-ihp_plus}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-dev-data:/data

  # S3-compatible object storage (RustFS, since MinIO stopped publishing images); prod uses real S3.
  minio:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-ihp}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-dev-data:/data

  # One-shot: the server has no auto-create, so the bucket is made on every `up` once it answers.
  minio-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      - minio
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 30); do
          aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null && exit 0
          aws --endpoint-url http://minio:9000 s3 mb "s3://$${S3_BUCKET}" && exit 0
          sleep 2
        done
        exit 1
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ihp}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ihp-plus}

volumes:
  postgres-dev-data:
  redis-dev-data:
  s3-dev-data:
